name: Validate gallery migration

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/**"
      - "contratar/**"
      - "supabase/sql/**"
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"
  push:
    branches:
      - migration/cloudflare-r2-prep
    paths:
      - "index.html"
      - "scripts/**"
      - "contratar/**"
      - "supabase/sql/**"
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript, SQL and Edge Function checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded app JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Check contracting page JavaScript syntax
        run: |
          node --check contratar/entre-estacoes/app.js
          node --input-type=module --check < contratar/entre-estacoes/admin/admin.js
      - name: Check contracting security and structure
        run: node scripts/check-contratacao.mjs
      - name: Build static site and verify isolated contracting pages
        run: npm run build
      - name: Install Playwright for browser verification
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test public contracting flow and admin login gate in Chromium
        run: node scripts/e2e-contratacao.mjs
      - name: Validate contracting migration and reservation logic in temporary PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-fixtures/contratacao-pre.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/sql/080_contratacao_experiencias.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-fixtures/contratacao-tests.sql
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Enable Deno npm dependency auto-install for CI
        run: echo '{"nodeModulesDir":"auto"}' > deno.json
      - name: Check R2 adapter and migrated functions
        env:
          # Dummy credentials are used only to calculate presigned URLs locally.
          # The test never sends a request to this endpoint.
          R2_ENDPOINT: https://00000000000000000000000000000000.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: test-access-key
          R2_SECRET_ACCESS_KEY: test-secret-key
          R2_BUCKET: grandfocus-fotos
        run: |
          deno check supabase/functions/_shared/r2.ts
          deno test '--allow-env=R2_ENDPOINT,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,AWS_*,SMITHY_*,HOME,USERPROFILE,HOMEPATH,HOMEDRIVE,_X_AMZN*' --allow-sys=osRelease supabase/functions/_shared/r2_mime_test.ts supabase/functions/_shared/r2_signing_test.ts
          deno check supabase/functions/galeria-publica/index.ts
          deno check supabase/functions/selecao-publica/index.ts
          deno check supabase/functions/r2-storage/index.ts
          deno check supabase/functions/_shared/contratacao.ts
          deno check supabase/functions/contratacao-publica/index.ts
          deno check supabase/functions/contratacao-webhook/index.ts
          deno check supabase/functions/contratacao-admin/index.ts
