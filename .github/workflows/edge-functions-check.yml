name: Validate gallery migration

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/**"
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"
  push:
    branches:
      - migration/cloudflare-r2-prep
    paths:
      - "index.html"
      - "scripts/**"
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript and Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded app JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check R2 adapter and migrated functions
        env:
          # Dummy credentials are used only to calculate presigned URLs locally.
          # The test never sends a request to this endpoint.
          R2_ENDPOINT: https://00000000000000000000000000000000.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: test-access-key
          R2_SECRET_ACCESS_KEY: test-secret-key
          R2_BUCKET: grandfocus-fotos
        run: |
          deno check supabase/functions/_shared/r2.ts
          deno test '--allow-env=R2_ENDPOINT,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,AWS_*,SMITHY_*,HOME,USERPROFILE,HOMEPATH,HOMEDRIVE,_X_AMZN*' --allow-sys=osRelease supabase/functions/_shared/r2_mime_test.ts supabase/functions/_shared/r2_signing_test.ts
          deno check supabase/functions/galeria-publica/index.ts
          deno check supabase/functions/selecao-publica/index.ts
          deno check supabase/functions/r2-storage/index.ts

      - name: Smoke test deployed R2 adapter boot
        env:
          SUPABASE_URL: https://selnsjtumkxjrtnqofqx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_a_yXSwHeOJNSw39UZsh4GQ_7SepV9i0
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.SUPABASE_URL}/functions/v1/r2-storage`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': process.env.SUPABASE_PUBLISHABLE_KEY,
            },
            body: JSON.stringify({}),
          });
          const body = await response.json().catch(() => ({}));
          if (response.status !== 401 || body?.error !== 'Sessão necessária.') {
            console.error('R2 adapter smoke test failed:', response.status, JSON.stringify(body));
            process.exit(1);
          }
          console.log('R2 adapter booted and rejected an unauthenticated request as expected.');
          NODE
