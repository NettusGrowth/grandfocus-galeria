name: Financeiro central
on:
  pull_request:
    paths:
      - 'contratar/admin/**'
      - 'contratar/planilha/**'
      - 'contratar/entre-estacoes/admin/**'
      - 'scripts/test-finance-central.mjs'
      - '.github/workflows/financeiro-central-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check contratar/admin/financeiro/financeiro.js
      - run: node --check contratar/admin/financeiro/finance-core.js
      - run: node scripts/test-finance-central.mjs
      - run: npm run build
