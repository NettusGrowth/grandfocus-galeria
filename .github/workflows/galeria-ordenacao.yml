name: Galeria — ordenação de fotografias
on:
  pull_request:
    paths:
      - 'index.html'
      - 'supabase/sql/103_fotos_nome_original.sql'
      - 'scripts/test-galeria-ordenacao.mjs'
      - 'scripts/build-gallery.cjs'
      - '.github/workflows/galeria-ordenacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-galeria-ordenacao.mjs
      - run: npm run build
