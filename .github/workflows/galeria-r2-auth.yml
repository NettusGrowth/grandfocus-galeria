name: Galeria — recuperar sessão de imagens
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-galeria-r2-auth.mjs'
      - '.github/workflows/galeria-r2-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-galeria-r2-auth.mjs
      - run: node scripts/test-gallery-load.mjs
      - run: npm run build
