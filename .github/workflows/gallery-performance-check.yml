name: Gallery performance regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-gallery-performance.mjs'
      - 'scripts/test-gallery-role-navigation.mjs'
      - '.github/workflows/gallery-performance-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-gallery-performance.mjs
      - run: node scripts/test-gallery-role-navigation.mjs
      - run: node scripts/test-gallery-load.mjs
      - run: npm run build
